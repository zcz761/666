<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong</title>
  <style>
    :root{
      --bg:#0b0f1a;
      --line:#2ec4b6;
      --paddle:#ffffff;
      --ball:#ffd166;
      --text:#dbe7ea;
    }

    html,body{
      height:100%;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#071021 0%, #0b1220 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
    }

    .wrap{
      text-align:center;
    }

    canvas{
      display:block;
      background: radial-gradient(circle at 20% 20%, rgba(46,196,182,0.03), transparent 10%),
                  linear-gradient(180deg, rgba(255,255,255,0.01), transparent 60%);
      border-radius:8px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.7);
      cursor: none; /* hide OS cursor for nicer paddle control */
    }

    .controls{
      margin-top:12px;
      font-size:14px;
      opacity:0.85;
    }

    .hint{
      margin-top:6px;
      font-size:13px;
      opacity:0.7;
    }

    button{
      margin-left:8px;
      padding:6px 10px;
      border-radius:6px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.03);
      color:var(--text);
      cursor:pointer;
    }
    button:active{ transform:translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="900" height="560" aria-label="Pong game"></canvas>
    <div class="controls">
      Use mouse or ↑ ↓ keys to move the left paddle. Press Space to pause/resume. <button id="restart">Restart</button>
    </div>
    <div class="hint">Left: You — Right: Computer</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Game dimensions (based on canvas size)
  const W = canvas.width;
  const H = canvas.height;

  // Paddles
  const paddleWidth = 14;
  const paddleHeight = 110;
  const paddleSpeed = 6; // for arrow keys
  let leftPaddle = {
    x: 24,
    y: (H - paddleHeight) / 2,
    w: paddleWidth,
    h: paddleHeight,
    dy: 0
  };
  let rightPaddle = {
    x: W - 24 - paddleWidth,
    y: (H - paddleHeight) / 2,
    w: paddleWidth,
    h: paddleHeight,
    dy: 0
  };

  // Ball
  const ballRadius = 9;
  let ball = {
    x: W / 2,
    y: H / 2,
    vx: 0,
    vy: 0,
    r: ballRadius,
    speed: 6
  };

  // Scores
  let score = { left: 0, right: 0 };

  // Game state
  let running = true;
  let paused = false;
  let mouseActive = false;
  let lastTime = 0;
  let serveDelay = 800; // ms pause after score

  // AI difficulty (0 = dumb, up to 1 = perfect). Lower value easier.
  const aiDifficulty = 0.12; // adjust 0.05..0.28

  // Initialize
  function resetBall(towardRight = Math.random() > 0.5) {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.speed = 6;
    const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8); // small random angle
    ball.vx = (towardRight ? 1 : -1) * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
  }

  resetBall(true);

  // Input handling
  const keys = { ArrowUp: false, ArrowDown: false };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowUp') keys.ArrowUp = true;
    if (e.code === 'ArrowDown') keys.ArrowDown = true;
    if (e.code === 'Space') {
      paused = !paused;
      if (!paused) lastTime = performance.now(); // prevent big dt
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowUp') keys.ArrowUp = false;
    if (e.code === 'ArrowDown') keys.ArrowDown = false;
  });

  // Mouse movement controls left paddle
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const y = e.clientY - rect.top;
    mouseActive = true;
    leftPaddle.y = y - leftPaddle.h / 2;
    clampPaddles();
  });

  canvas.addEventListener('mouseleave', () => {
    mouseActive = false;
  });

  document.getElementById('restart').addEventListener('click', () => {
    score.left = 0; score.right = 0;
    leftPaddle.y = (H - leftPaddle.h) / 2;
    rightPaddle.y = (H - rightPaddle.h) / 2;
    resetBall(true);
    paused = false;
  });

  // Utility
  function clampPaddles() {
    leftPaddle.y = Math.max(0, Math.min(H - leftPaddle.h, leftPaddle.y));
    rightPaddle.y = Math.max(0, Math.min(H - rightPaddle.h, rightPaddle.y));
  }

  function rectsIntersect(ax,ay,aw,ah, bx,by,bw,bh){
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  // Paddle/ball collision reaction
  function handlePaddleCollision(paddle, isLeft){
    // reverse X velocity, add some Y based on where it hit the paddle
    // compute relative hit position (-1 top -> +1 bottom)
    const relativeIntersectY = (ball.y - (paddle.y + paddle.h / 2));
    const normalized = (relativeIntersectY) / (paddle.h / 2);
    const maxBounceAngle = Math.PI / 3; // 60 degrees
    const bounceAngle = normalized * maxBounceAngle;
    const direction = isLeft ? 1 : -1;
    // increase speed slightly on each paddle hit to make game more challenging
    ball.speed = Math.min(14, ball.speed + 0.25);
    ball.vx = direction * ball.speed * Math.cos(bounceAngle);
    ball.vy = ball.speed * Math.sin(bounceAngle);
    // nudge ball out of paddle to avoid multiple collisions in same frame
    if (isLeft) ball.x = paddle.x + paddle.w + ball.r + 0.5;
    else ball.x = paddle.x - ball.r - 0.5;
  }

  // Game loop
  function update(dt) {
    if (paused) return;

    // Left paddle movement via arrow keys (only if mouse isn't actively used)
    if (!mouseActive) {
      if (keys.ArrowUp) leftPaddle.y -= paddleSpeed;
      if (keys.ArrowDown) leftPaddle.y += paddleSpeed;
      clampPaddles();
    }

    // Right paddle AI: move towards ball with limited speed (based on aiDifficulty)
    const targetY = ball.y - rightPaddle.h / 2;
    // Interpolate
    rightPaddle.y += (targetY - rightPaddle.y) * aiDifficulty * Math.min(1, dt / 16.67);
    clampPaddles();

    // Move the ball
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions (top/bottom)
    if (ball.y - ball.r <= 0) {
      ball.y = ball.r + 0.5;
      ball.vy *= -1;
    } else if (ball.y + ball.r >= H) {
      ball.y = H - ball.r - 0.5;
      ball.vy *= -1;
    }

    // Paddle collisions
    // Left paddle
    if (ball.vx < 0 &&
        rectsIntersect(ball.x - ball.r, ball.y - ball.r, ball.r*2, ball.r*2,
                       leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h)) {
      handlePaddleCollision(leftPaddle, true);
    }
    // Right paddle
    if (ball.vx > 0 &&
        rectsIntersect(ball.x - ball.r, ball.y - ball.r, ball.r*2, ball.r*2,
                       rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h)) {
      handlePaddleCollision(rightPaddle, false);
    }

    // Scoring
    if (ball.x + ball.r < 0) {
      // Right scores
      score.right += 1;
      paused = true;
      setTimeout(() => {
        resetBall(true);
        paused = false;
      }, serveDelay);
    } else if (ball.x - ball.r > W) {
      // Left scores
      score.left += 1;
      paused = true;
      setTimeout(() => {
        resetBall(false);
        paused = false;
      }, serveDelay);
    }
  }

  // Rendering
  function drawNet() {
    const segment = 16;
    ctx.fillStyle = "rgba(46,196,182,0.14)";
    for (let y = 16; y < H; y += segment*1.4) {
      ctx.fillRect(W/2 - 1, y, 2, segment/2);
    }
  }

  function draw() {
    // background
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(4,6,10,0.35)";
    ctx.fillRect(0,0,W,H);

    drawNet();

    // draw paddles
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    roundRect(ctx, leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h, 6, true, false);
    roundRect(ctx, rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h, 6, true, false);

    // draw ball
    ctx.beginPath();
    const grad = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, ball.r*1.2);
    grad.addColorStop(0, "#fff4d1");
    grad.addColorStop(1, "#ffb84d");
    ctx.fillStyle = grad;
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();

    // scoreboard
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "700 46px system-ui, Arial";
    ctx.textAlign = "center";
    ctx.fillText(score.left, W * 0.25, 60);
    ctx.fillText(score.right, W * 0.75, 60);

    // small status
    ctx.font = "13px system-ui, Arial";
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillText("Press Space to Pause/Resume", 12, H - 12);

    if (paused) {
      ctx.fillStyle = "rgba(5,8,12,0.6)";
      ctx.fillRect(W/2 - 180, H/2 - 48, 360, 96);
      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.font = "600 22px system-ui, Arial";
      ctx.textAlign = "center";
      ctx.fillText("PAUSED", W/2, H/2 - 6);
      ctx.font = "13px system-ui, Arial";
      ctx.fillText("Score will resume after a short delay when someone scores", W/2, H/2 + 20);
    }
  }

  // Round rect helper for nicer paddles
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // Main loop using requestAnimationFrame
  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    update(dt);
    draw();
    if (running) requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // Resize handling: keep canvas resolution stable but scale visually if window smaller.
  function scaleCanvasToFit() {
    // We keep logical canvas size constant; but scale CSS size to fit viewport while preserving ratio.
    const maxWidth = Math.min(window.innerWidth - 40, 1000);
    const scale = Math.min(maxWidth / W, (window.innerHeight - 120) / H, 1);
    canvas.style.width = Math.round(W * scale) + "px";
    canvas.style.height = Math.round(H * scale) + "px";
  }

  window.addEventListener('resize', scaleCanvasToFit);
  scaleCanvasToFit();

  // Accessibility: allow clicking canvas to toggle pause too
  canvas.addEventListener('click', () => {
    paused = !paused;
    if (!paused) lastTime = performance.now();
  });

})();
</script>
</body>
</html>
